<style>
/* Layout: barra de filtros fija arriba, pestañas, y vistas de trabajo densas (resumen → SKU → talla → OC → cargas) */
:root{

:root[data-theme="dark"]{

[hidden]{display:none!important}
body{margin:0;font-size:14px}

.curve{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(64px,1fr);gap:6px;overflow-x:auto;padding:4px 0}
.cv{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 8px;display:grid;gap:2px;font-size:12px}

.cv .fr{font-family:var(--f-mono);font-weight:500}

.heat td.c{text-align:center;font-family:var(--f-mono);font-size:12.5px;padding:6px 4px;min-width:46px}
.heat td.c.ok{background:var(--ok-bg);color:var(--ok)} .heat td.c.warn{background:var(--warn-bg);color:var(--warn)} .heat td.c.crit{background:var(--crit-bg);color:var(--crit);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg .lbl{fill:var(--ink);font-weight:500}
svg .grid{stroke:var(--line);stroke-width:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px;border-right:1px solid var(--line)}

.seg input{position:absolute;opacity:0;pointer-events:none}

.drop{border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:var(--sunken)}
.drop.over{border-color:var(--accent);color:var(--ink)}
.formrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

.sizecols{display:flex;flex-wrap:wrap;gap:6px}

.msg{font-size:14px;padding:8px 12px;border-radius:6px}

.hist{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

.empty{padding:28px;text-align:center;color:var(--muted)}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:5px;max-width:260px;white-space:pre-line}
.how{font-size:14px;color:var(--muted);max-width:70ch}
.how b{color:var(--ink)}
.sev.neutral{background:var(--sunken);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fun{display:grid;gap:8px}
.fun-row{display:grid;grid-template-columns:110px minmax(80px,1fr) minmax(0,230px);gap:4px 12px;align-items:center}
.fun-l{font-weight:600;font-size:14px}
.fun-bar{height:14px;background:var(--sunken);border-radius:4px;overflow:hidden}

.fun-sug{background:var(--muted)} .fun-oc{background:var(--accent)} .fun-desp{background:var(--ok)}
.fun-v{font-size:13px;white-space:nowrap;text-align:right;overflow:hidden;text-overflow:ellipsis}
.fun-n{grid-column:2 / -1}

.fchip{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip .num{font-size:12px;color:var(--muted)}
.fchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.dh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.ncgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.tin{font:inherit;font-family:var(--f-mono);font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);width:80px}
.tin.wide{width:140px} .tin.r{text-align:right}
.btn.small-btn{padding:4px 10px;font-size:13px}
.estsel{font:inherit;font-size:12.5px;font-weight:700;border-radius:4px;padding:3px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.estsel.ok{background:var(--ok-bg);color:var(--ok)} .estsel.warn{background:var(--warn-bg);color:var(--warn)} .estsel.info{background:var(--accent-soft);color:var(--accent)} .estsel.neutral{color:var(--muted)}
a{color:var(--accent)}
.login{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;display:grid;gap:14px;width:min(380px,100%)}
dialog#dPass{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(380px,calc(100% - 32px))}
dialog#dPass::backdrop{background:rgba(10,14,20,.45)}
dialog#dPass form{padding:24px;display:grid;gap:12px}
dialog#dPass input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.login input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
body.lector #btnIrCargar,body.lector [data-act=nc-nueva],body.lector [data-act=nc-desde-oc],body.lector [data-act=nc-editar],body.lector [data-ncdel],body.lector [data-del],body.lector .upload-only{display:none!important}

</style>

    <div>
      <h1>Control Fill Rate · PUMA</h1>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN=n=>Math.round(n||0).toLocaleString("es-CL");
const fmt$=n=>(n<0?"−$":"$")+Math.round(Math.abs(n||0)).toLocaleString("es-CL");
const pct=(x,d=1)=>x==null||!isFinite(x)?"—":(x*100).toFixed(d).replace(".",",")+"%";

function normTalla(t){
  let s=String(t??"").trim().toUpperCase().replace(",",".");

}
function tallaRank(t){const i=ALPHA.indexOf(t);if(i>=0)return[1,i,""];if(/^\d+(\.\d+)?$/.test(t))return[0,parseFloat(t),""];return[2,0,t];}
function sortTallas(a){return a.slice().sort((x,y)=>{const A=tallaRank(x),B=tallaRank(y);return A[0]-B[0]||A[1]-B[1]||A[2].localeCompare(B[2]);});}

        let r=base+(R()-.5)*.1; if(ti===tallas.length-1||ti===0) r-=.3; if(t==="XL") r-=.25;
        if(sku==="EJ-658934-04"&&t==="M") r=0;

    add("demo-sug-"+ci,{tipo:"sugerido",cliente:cli,fecha:"2026-09-01",archivo:"sugerido_"+(ci?"B":"A")+"_temporada.xlsx",creado:"2026-09-01"},sug);
    ocs.forEach(([ocn,f,v])=>{ if(oc[ocn]) add("demo-oc-"+ocn,{tipo:"oc",sugerido_id:"demo-sug-"+ci,cliente:cli,ocLbl:ocn,ocs:[cli+"|"+ocn],fecha:f,vence:v,archivo:ocn+".xlsx",creado:f},oc[ocn]); });

  const ncs=[
    {id:"demo-nc1",numero:"",cliente:"Cliente ejemplo A",oc:"OC-EJ-1001",fecha:"2026-10-08",motivo:"Devolución",estado:"En revisión",monto:259850,lineas:[{sku:"EJ-390117-02",talla:"42",q:5,precio:51970}],notas:"Cliente reporta falla de pegado en 5 pares.",historial:[{estado:"Solicitada",fecha:"2026-10-08"},{estado:"En revisión",fecha:"2026-10-10"}]},
    {id:"demo-nc2",numero:"NC 10482",cliente:"Cliente ejemplo B",oc:"OC-EJ-2001",fecha:"2026-10-03",motivo:"Diferencia de precio",estado:"Emitida",monto:84000,lineas:[],notas:"Precio de lista vs precio acordado en el sugerido.",historial:[{estado:"Solicitada",fecha:"2026-10-03"},{estado:"Aprobada",fecha:"2026-10-06"},{estado:"Emitida",fecha:"2026-10-09"}]},

  return {cargas,partes,ncs};

const DEMO=demo();

/* ---------- Fuente de filas ---------- */
const esDemo=()=>S.cargas.length===0;
function fuente(){
  const cargas=esDemo()?DEMO.cargas:S.cargas, partes=esDemo()?DEMO.partes:S.partes;
  const filas={sug:[],oc:[],desp:[]}, desc={};
  for(const c of cargas){
    const ps=partes[c.id]; if(!ps) continue;
    const dest=c.tipo==="sugerido"?filas.sug:c.tipo==="oc"?filas.oc:filas.desp;
    for(const p of ps){
      for(const k in p.desc||{}) desc[normSku(k)]=p.desc[k];
      for(const f of p.filas) dest.push({cliente:f[0],oc:f[1],sku:normSku(f[2]),talla:f[3],q:f[4],precio:f[5]||0,fecha:c.fecha||"",vence:c.vence||"",carga:c.id,archivo:c.archivo||"",sug:c.sugerido_id||""});
    }
  }
  return {filas,desc,cargas,ncs:esDemo()&&!S.ncs.length?DEMO.ncs:S.ncs};
}

/* ---------- Cálculo ---------- */
function calcular(){
  const u=(S.config.umbral||90)/100, F=S.filtros, H=hoy();
  const {filas,desc,cargas,ncs}=fuente();
  const inC=r=>!F.cliente||r.cliente===F.cliente;
  const precioRef=new Map();
  for(const r of [...filas.sug,...filas.oc]) if(r.precio>0){precioRef.set(r.sku+"|"+r.talla,r.precio); precioRef.set(r.sku,r.precio);}
  const pr=(sku,talla,p)=>p>0?p:(precioRef.get(sku+"|"+talla)||precioRef.get(sku)||0);

  const lines=new Map(), ocInfo=new Map();
  for(const r of filas.oc){ if(!inC(r)) continue;
    const ok=r.cliente+"|"+r.oc;
    let o=ocInfo.get(ok); if(!o){o={cliente:r.cliente,oc:r.oc,fecha:r.fecha,vence:r.vence,sugId:"",cargas:new Set()};ocInfo.set(ok,o);}
    if(r.sug) o.sugId=r.sug;
    o.cargas.add(r.carga); if(r.fecha&&r.fecha<o.fecha)o.fecha=r.fecha; if(r.vence)o.vence=r.vence;
    const k=[r.cliente,r.oc,r.sku,r.talla].join("|");
    let l=lines.get(k); if(!l){l={cliente:r.cliente,oc:r.oc,sku:r.sku,talla:r.talla,ocQ:0,desp:0,precio:0,fecha:r.fecha,envios:[]};lines.set(k,l);}
    l.ocQ+=r.q; if(r.precio>0) l.precio=r.precio;
  }
  for(const l of lines.values()) if(!l.precio) l.precio=pr(l.sku,l.talla,0);
  const sinOc=[], pool=[];
  for(const r of filas.desp){ if(!inC(r)) continue;
    const env={carga:r.carga,archivo:r.archivo,fecha:r.fecha};
    if(r.oc){const l=lines.get([r.cliente,r.oc,r.sku,r.talla].join("|"));
      if(l){l.desp+=r.q; l.envios.push({...env,q:r.q});}
      else sinOc.push({...r,motivo:ocInfo.has(r.cliente+"|"+r.oc)?"SKU/talla no está en la OC":"OC no cargada"});}
    else pool.push(r);
  }
  if(pool.length){
    const idx=new Map();
    for(const l of lines.values()){const k=[l.cliente,l.sku,l.talla].join("|"); (idx.get(k)||idx.set(k,[]).get(k)).push(l);}
    for(const a of idx.values()) a.sort((x,y)=>String(x.fecha).localeCompare(String(y.fecha)));
    pool.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
    for(const r of pool){
      const arr=idx.get([r.cliente,r.sku,r.talla].join("|"));
      if(!arr){sinOc.push({...r,motivo:"Sin OC que lo pida"});continue;}
      let rest=r.q;
      for(const l of arr){const t=Math.min(Math.max(0,l.ocQ-l.desp),rest); if(t>0){l.desp+=t; l.envios.push({carga:r.carga,archivo:r.archivo,fecha:r.fecha,q:t,auto:true}); rest-=t;}}
      if(rest>0){const l=arr[arr.length-1]; l.desp+=rest; l.envios.push({carga:r.carga,archivo:r.archivo,fecha:r.fecha,q:rest,auto:true});}
    }
  }
  const Lall=[...lines.values()];
  for(const l of Lall){l.ent=Math.min(l.desp,l.ocQ); l.sobre=Math.max(0,l.desp-l.ocQ); l.falta=l.ocQ-l.ent;}

  // Notas de crédito por OC (las rechazadas no cuentan)
  const ncPorOc=new Map();
  for(const n of ncs){ if(!n.oc||n.estado==="Rechazada") continue; const k=n.cliente+"|"+n.oc; const x=ncPorOc.get(k)||{n:0,monto:0}; x.n++; x.monto+=n.monto||0; ncPorOc.set(k,x);}

  // Órdenes de compra (historial completo, solo filtro de cliente)
  const ocs=new Map();
  for(const l of Lall){const k=l.cliente+"|"+l.oc; let o=ocs.get(k);
    if(!o){const i=ocInfo.get(k); o={key:k,cliente:l.cliente,oc:l.oc,fecha:i.fecha,vence:i.vence,sugId:i.sugId,cargaIds:[...i.cargas],ocQ:0,ent:0,desp:0,sobre:0,montoOc:0,montoEnt:0,lineas:0,lineasOk:0,lineasCero:0,sinPrecio:0,envios:new Map(),L:[]};ocs.set(k,o);}
    o.L.push(l); o.ocQ+=l.ocQ;o.ent+=l.ent;o.desp+=l.desp;o.sobre+=l.sobre;o.montoOc+=l.ocQ*l.precio;o.montoEnt+=l.ent*l.precio;o.lineas++;
    if(!l.precio)o.sinPrecio++; if(l.desp>=l.ocQ)o.lineasOk++; if(l.desp===0)o.lineasCero++;
    for(const e of l.envios){const x=o.envios.get(e.carga)||{carga:e.carga,archivo:e.archivo,fecha:e.fecha,q:0,monto:0,auto:false}; x.q+=e.q; x.monto+=e.q*l.precio; x.auto=x.auto||!!e.auto; o.envios.set(e.carga,x);}
  }
  const ocList=[...ocs.values()].map(o=>{
    o.fr=o.ocQ?o.ent/o.ocQ:null; o.frL=o.lineas?o.lineasOk/o.lineas:null; o.cerrada=!!S.estadoOc[ocKey(o.cliente,o.oc)];
    o.montoPend=o.montoOc-o.montoEnt; o.nc=ncPorOc.get(o.key)||{n:0,monto:0};
    const vencida=o.vence&&o.vence<H;
    o.estado=o.cerrada?"Cerrada":o.ent>=o.ocQ?"Completa":vencida?"Atrasada":o.desp===0?"Sin despacho":"Parcial";
    o.ultimoDesp=[...o.envios.values()].reduce((m,e)=>e.fecha>m?e.fecha:m,"");
    return o;
  }).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))||a.oc.localeCompare(b.oc));

  // Líneas que entran a la medición
  let L=Lall;
  if(F.oc) L=L.filter(l=>l.cliente+"|"+l.oc===F.oc);
  if(F.soloCerradas) L=L.filter(l=>S.estadoOc[ocKey(l.cliente,l.oc)]);
  const pendientes=new Set(L.filter(l=>ocs.get(l.cliente+"|"+l.oc).desp===0).map(l=>l.cliente+"|"+l.oc));
  L=L.filter(l=>!pendientes.has(l.cliente+"|"+l.oc));

  const sug=new Map();
  if(!F.oc && !F.soloCerradas) for(const r of filas.sug){ if(!inC(r)) continue; const k=r.sku+"|"+r.talla; sug.set(k,(sug.get(k)||0)+r.q); }

  // Por SKU
  const skus=new Map();
  const getSku=s=>{let o=skus.get(s); if(!o){o={sku:s,desc:desc[s]||"",ocQ:0,ent:0,desp:0,sobre:0,sug:0,lineas:0,lineasOk:0,tallas:new Map()};skus.set(s,o);} return o;};
  const getT=(o,t)=>{let x=o.tallas.get(t); if(!x){x={talla:t,ocQ:0,ent:0,desp:0,sug:0};o.tallas.set(t,x);} return x;};
  for(const l of L){const o=getSku(l.sku),t=getT(o,l.talla);
    o.ocQ+=l.ocQ;o.ent+=l.ent;o.desp+=l.desp;o.sobre+=l.sobre;o.lineas++; if(l.desp>=l.ocQ)o.lineasOk++;
    t.ocQ+=l.ocQ;t.ent+=l.ent;t.desp+=l.desp;}
  for(const [k,q] of sug){const [s,t]=k.split("|"); const o=getSku(s); o.sug+=q; getT(o,t).sug+=q;}
  const skuList=[...skus.values()];
  for(const o of skuList){
    o.fr=o.ocQ?o.ent/o.ocQ:null; o.conv=o.sug?o.ocQ/o.sug:null; o.falta=o.ocQ-o.ent;
    for(const t of o.tallas.values()) t.fr=t.ocQ?t.ent/t.ocQ:null;
    o.tallasBajas=sortTallas([...o.tallas.values()].filter(t=>t.ocQ&&t.fr<u).map(t=>t.talla)).map(t=>o.tallas.get(t));
    o.tallasCero=o.ent>0?o.tallasBajas.filter(t=>t.ent===0):[];
  }

  // Por talla
  const tallas=new Map();
  for(const l of L){let t=tallas.get(l.talla); if(!t){t={talla:l.talla,ocQ:0,ent:0,skus:new Set()};tallas.set(l.talla,t);} t.ocQ+=l.ocQ;t.ent+=l.ent; if(l.ent<l.ocQ*u) t.skus.add(l.sku);}
  const tallaList=sortTallas([...tallas.keys()]).map(k=>{const t=tallas.get(k); t.fr=t.ocQ?t.ent/t.ocQ:null; t.falta=t.ocQ-t.ent; return t;});

  // Totales
  const T={ocQ:0,ent:0,desp:0,sobre:0,lineas:L.length,lineasOk:0,sug:0,ocConSug:0,montoOc:0,montoEnt:0};
  for(const l of L){T.ocQ+=l.ocQ;T.ent+=l.ent;T.desp+=l.desp;T.sobre+=l.sobre;T.montoOc+=l.ocQ*l.precio;T.montoEnt+=l.ent*l.precio; if(l.desp>=l.ocQ)T.lineasOk++;}
  for(const o of skuList){ if(o.sug){T.sug+=o.sug; T.ocConSug+=o.ocQ;} }
  T.fr=T.ocQ?T.ent/T.ocQ:null; T.frL=T.lineas?T.lineasOk/T.lineas:null; T.conv=T.sug?T.ocConSug/T.sug:null; T.falta=T.ocQ-T.ent; T.montoPend=T.montoOc-T.montoEnt;

  // Alertas
  const A=[];
  for(const o of skuList){ if(!o.ocQ) continue;
    if(o.fr<u){
      const tx=o.tallasBajas.map(t=>`${t.talla} ${pct(t.fr,0)}`).join(" · ");
      A.push({sev:st(o.fr,u),tipo:"SKU bajo",titulo:o.sku+(o.desc?" · "+o.desc:""),texto:`Fill rate ${pct(o.fr)}. Tallas bajo umbral: ${tx||"—"}`+(o.tallasCero.length?`. Curva rota: ${o.tallasCero.map(t=>t.talla).join(", ")} sin despacho`:""),q:o.falta});
    } else if(o.tallasCero.length){
      A.push({sev:"warn",tipo:"Curva rota",titulo:o.sku+(o.desc?" · "+o.desc:""),texto:`SKU sobre umbral, pero ${o.tallasCero.map(t=>t.talla).join(", ")} no se despachó`,q:o.tallasCero.reduce((s,t)=>s+t.ocQ,0)});
    }
  }
  for(const t of tallaList){ if(t.fr!=null&&t.fr<u) A.push({sev:st(t.fr,u),tipo:"Talla",titulo:"Talla "+t.talla,texto:`Fill rate ${pct(t.fr)} en ${t.skus.size} SKU${t.skus.size===1?"":"s"}`,q:t.falta}); }
  const atrasadas=ocList.filter(o=>o.estado==="Atrasada"&&(!F.oc||o.key===F.oc));
  if(atrasadas.length) A.push({sev:"crit",tipo:"OC atrasada",titulo:`${atrasadas.length} OC pasada${atrasadas.length>1?"s":""} de su fecha límite sin completar`,texto:atrasadas.slice(0,5).map(o=>`${o.oc} (${pct(o.fr,0)}, vencía ${fdate(o.vence)})`).join(" · "),q:atrasadas.reduce((s,o)=>s+o.ocQ-o.ent,0),ir:"ocs"});
  const sobreSkus=skuList.filter(o=>o.sobre>0);
  if(sobreSkus.length) A.push({sev:"info",tipo:"Sobre-despacho",titulo:`${sobreSkus.length} SKU con más unidades que la OC`,texto:sobreSkus.slice(0,6).map(o=>`${o.sku} +${fmtN(o.sobre)}`).join(" · "),q:0});
  if(sinOc.length){const q=sinOc.reduce((s,r)=>s+r.q,0); A.push({sev:"info",tipo:"Despacho sin cruce",titulo:`${fmtN(q)} uds despachadas no calzan con una OC`,texto:[...new Set(sinOc.map(r=>r.motivo))].join(" · ")+". Revisa el N° de OC o el SKU en el archivo de despacho.",q:0});}
  if(pendientes.size) A.push({sev:"info",tipo:"Sin despacho aún",titulo:`${pendientes.size} OC sin ningún despacho cargado`,texto:[...pendientes].slice(0,6).map(k=>k.split("|")[1]).join(" · ")+". No entran al fill rate hasta que subas su primer despacho.",q:0});
  const rank={crit:0,warn:1,info:2};
  A.sort((a,b)=>rank[a.sev]-rank[b.sev]||b.q-a.q);
  return {u,L,Lall,skuList,tallaList,ocList,ocs,T,A,sinOc,pendientes,filas,desc,cargas,ncs,pr};
}

/* ---------- Sugeridos: cada sugerido con sus OCs y lo despachado de cada una ----------
   Una OC pertenece a un sugerido si se asoció al subirla (o después, desde su detalle).
   Las OCs sin asociar se asignan al último sugerido del mismo cliente anterior a la OC. */
function sugeridoPorFecha(cliente,fecha){
  const sc=R.cargas.filter(c=>c.tipo==="sugerido"&&(c.cliente===cliente||(c.clientes||[]).includes(cliente))&&String(c.fecha)<=String(fecha||"9999"));
  sc.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))||String(b.creado).localeCompare(String(a.creado)));
  return sc[0]?.id||"";
}
function sugeridoDeOc(o){ return o.sugId&&R.cargas.some(c=>c.id===o.sugId)?{id:o.sugId,auto:false}:{id:sugeridoPorFecha(o.cliente,o.fecha),auto:true}; }
function sugeridos(){
  const {filas,cargas,desc,pr,ocList}=R, F=S.filtros;
  const out=[];
  for(const c of cargas.filter(c=>c.tipo==="sugerido")){
    const rows=filas.sug.filter(r=>r.carga===c.id&&(!F.cliente||r.cliente===F.cliente)); if(!rows.length) continue;
    const clientes=[...new Set(rows.map(r=>r.cliente))];
    const ocs=ocList.filter(o=>sugeridoDeOc(o).id===c.id);
    const lines=new Map();
    const get=(cl,sku,t)=>{const k=cl+"|"+sku+"|"+t; let l=lines.get(k); if(!l){l={cliente:cl,sku,talla:t,sug:0,oc:0,ent:0,precio:pr(sku,t,0),fuera:true};lines.set(k,l);} return l;};
    for(const r of rows){const l=get(r.cliente,r.sku,r.talla); l.sug+=r.q; l.fuera=false; if(r.precio>0) l.precio=r.precio;}
    for(const o of ocs) for(const x of o.L){const l=get(x.cliente,x.sku,x.talla); l.oc+=x.ocQ; l.ent+=x.ent;}
    const L=[...lines.values()], dentro=L.filter(l=>!l.fuera);
    const T={sug:0,oc:0,ent:0,ocFuera:0,mSug:0,mOc:0,mEnt:0};
    for(const l of L){ if(l.fuera){T.ocFuera+=l.oc;} else {T.sug+=l.sug; T.mSug+=l.sug*l.precio;} T.oc+=l.oc; T.ent+=l.ent; T.mOc+=l.oc*l.precio; T.mEnt+=l.ent*l.precio; }
    const ocDentro=dentro.reduce((s,l)=>s+Math.min(l.oc,l.sug),0);
    const skus=new Map(); for(const l of L){const o=skus.get(l.sku)||{sku:l.sku,desc:desc[l.sku]||"",sug:0,oc:0,ent:0,tallas:[]}; o.sug+=l.sug;o.oc+=l.oc;o.ent+=l.ent;o.tallas.push(l); skus.set(l.sku,o);}
    const sk=[...skus.values()];
    out.push({c,clientes,L,sk,ocs,T,conv:T.sug?ocDentro/T.sug:null,fr:T.oc?T.ent/T.oc:null,avance:T.sug?Math.min(T.ent,T.sug)/T.sug:null,
      noComprados:sk.filter(o=>o.sug>0&&o.oc===0).length,nSkus:sk.filter(o=>o.sug>0).length,
      abiertas:ocs.filter(o=>!["Completa","Cerrada"].includes(o.estado)).length});
  }
  return out.sort((a,b)=>String(b.c.fecha).localeCompare(String(a.c.fecha)));
}

/* ---------- Render ---------- */
let R=null;
const TABS=[["resumen","Resumen"],["ocs","Órdenes de compra"],["sugeridos","Sugeridos"],["sku","Por SKU"],["talla","Por talla"],["nc","Notas de crédito"],["cargas","Cargas"]];
function render(){
  R=calcular();
  renderBanner(); renderFiltros(); renderTabs();
  const v=$("#view"), V={resumen:vResumen,ocs:vOcs,sugeridos:vSugeridos,sku:vSku,talla:vTalla,nc:vNc,cargas:vCargas}[S.tab]||vResumen;
  v.innerHTML=V();
  $("#btnExport").hidden=!S.downloads||!R.Lall.length;
}
function renderBanner(){
  let h="";
  if(esDemo()) h+=`<div class="banner"><b>Datos de ejemplo.</b> Clientes, OCs, precios y notas de crédito inventados para mostrar cómo funciona. Desaparecen cuando subes tu primer archivo en <b>Cargas</b>.</div>`;

function chartTallas(){
  const {tallaList,u}=R; const d=tallaList.filter(t=>t.ocQ);
  if(!d.length) return `<div class="empty">Sin datos</div>`;
  const W=Math.max(320,d.length*44+50),H=230,pl=38,pr=8,pt=22,pb=34,iw=W-pl-pr,ih=H-pt-pb;
  const bw=Math.min(30,iw/d.length-6), y=v=>pt+ih-(v*ih);
  let g="";
  [0,.25,.5,.75,1].forEach(v=>{g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`;});
  const many=d.length>12;
  d.forEach((t,i)=>{
    const cx=pl+(i+.5)*(iw/d.length), h=Math.max(1,t.fr*ih), s=st(t.fr,u);
    const tip=`Talla ${t.talla}\nFill rate ${pct(t.fr)}\n${fmtN(t.ent)} de ${fmtN(t.ocQ)} uds\n${t.skus.size} SKU bajo umbral`;
    g+=`<g data-tip="${esc(tip)}"><rect x="${cx-iw/d.length/2}" y="${pt}" width="${iw/d.length}" height="${ih}" fill="transparent"/>
      <path d="M${cx-bw/2},${y(0)} V${y(0)-h+4} q0,-4 4,-4 h${bw-8} q4,0 4,4 V${y(0)} Z" style="fill:var(--${s})"/>
      ${!many||s!=="ok"?`<text class="lbl" x="${cx}" y="${y(0)-h-6}" text-anchor="middle">${Math.round(t.fr*100)}</text>`:""}
      <text x="${cx}" y="${H-pb+16}" text-anchor="middle" style="font-weight:500">${esc(t.talla)}</text></g>`;
  });
  g+=`<line class="thr" x1="${pl}" x2="${W-pr}" y1="${y(u)}" y2="${y(u)}"/>`;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,520)}px;max-width:${W}px;display:block" role="img" aria-label="Fill rate por talla">${g}</svg></div>`;
}

function vSku(){

  let list=skuList.filter(o=>qmatch(o.sku,o.desc));

  list.sort((a,b)=>{const A=a[k],B=b[k]; if(A==null&&B==null)return 0; if(A==null)return 1; if(B==null)return -1; return (typeof A==="string"?A.localeCompare(B):A-B)*dir;});
  const th=(key,l,r)=>`<th class="sort ${r?"r":""}" data-sort="${key}">${l}${k===key?(dir===1?" ↑":" ↓"):""}</th>`;

    <td><div class="chips">${o.tallasBajas.map(t=>`<span class="chip ${st(t.fr,u)}">${esc(t.talla)} ${pct(t.fr,0)}</span>`).join("")}</div></td></tr>
    ${op?`<tr class="detail"><td colspan="9"><div class="curve">${sortTallas([...o.tallas.keys()]).map(tk=>{const t=o.tallas.get(tk),s=st(t.fr,u);
      return `<div class="cv ${s}"><span class="tl">${esc(t.talla)}</span><span class="muted">Sug ${t.sug?fmtN(t.sug):"—"}</span><span class="muted">OC ${fmtN(t.ocQ)}</span><span class="muted">Desp ${fmtN(t.desp)}</span><span class="fr" style="color:var(--${s==="na"?"muted":s})">${pct(t.fr,0)}</span></div>`;}).join("")}</div></td></tr>`:""}`;}).join("")}
  </tbody></table></div></div>`;
}

async function ncGuardar(){
  const f=S.ncForm; f.err=null;
  const lineas=f.lineas.map(l=>({sku:normSku(l.sku),talla:normTalla(l.talla),q:num(l.q),precio:num(l.precio)})).filter(l=>l.sku&&l.q>0);
  const monto=lineas.length?lineas.reduce((s,l)=>s+l.q*l.precio,0):num(f.monto);
  if(!f.cliente) f.err="Elige el cliente.";
  else if(!(monto>0)) f.err="El monto debe ser mayor a cero.";
  if(f.err){render(); return;}
  const prev=S.ncs.find(n=>n.id===f.id);
  const historial=(prev?.historial||[]).slice(); if(!prev||prev.estado!==f.estado) historial.push({estado:f.estado,fecha:hoy()});
  const doc={numero:clean(f.numero),cliente:f.cliente,oc:f.oc,fecha:f.fecha,motivo:f.motivo,estado:f.estado,monto,lineas,notas:clean(f.notas),historial,actualizado:new Date().toISOString(),creado:prev?.creado||new Date().toISOString()};
    try{ await API.guardarNc(f.id,doc); S.ncForm=null; await recargar(); }
  catch(e){ f.err="No se pudo guardar: "+errTxt(e); }
  render();
}
async function ncCambiarEstado(id,estado){

/* ---------- Cargas ---------- */
const SYN={
  sku:["sku","material","articulo","codigo","cod","codigo material","style","estilo","modelo","item","referencia","ref","cod articulo","codigo articulo","style color","estilo color"],
  talla:["talla","size","talle","tamano","tam","medida"],
  oc:["oc","o.c","n oc","nro oc","n° oc","numero oc","orden de compra","orden compra","po","purchase order","po number","pedido cliente","nro orden"],
  cliente:["cliente","customer","cadena","sold to","solicitante","destinatario","razon social"],
  desc:["descripcion","description","nombre","desc","detalle","descripcion material","nombre producto"],
  precio:["precio","precio unitario","precio neto","precio venta","precio de venta","p unit","p. unit","precio unit","valor unitario","unit price","price","pvp","precio lista","costo unitario","valor neto"],
  cant:["cantidad","cant","qty","quantity","unidades","uds","unid","pares","pcs","piezas","sugerido","sugerida","despachado","despacho","cantidad despachada","cantidad pedida","solicitado","confirmado","enviado","cant oc","cantidad oc","unidades oc"]
};
const FIELDS=["sku","talla","oc","cliente","desc","precio","cant"];
const nh=h=>String(h??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[_\-]/g," ").replace(/\s+/g," ").trim();
function esTallaHeader(h){const t=normTalla(h); if(ALPHA.includes(t)||t==="OSFA") return true; if(/^\d{1,2}(\.5)?$/.test(t)){const n=parseFloat(t); return n>=1&&n<=50;} return false;}
function detectarHeader(aoa){
  let best=0,score=-1;
  for(let i=0;i<Math.min(25,aoa.length);i++){
    const r=aoa[i]||[]; let s=0;
    for(const c of r){const h=nh(c); if(!h) continue; if(Object.values(SYN).some(a=>a.includes(h))) s+=2; else if(esTallaHeader(c)) s+=1;}
    if(s>score){score=s;best=i;}
  }
  return best;
}
function autoMap(headers){
  const map={}, used=new Set(), H=headers.map(nh); FIELDS.forEach(f=>map[f]=-1);
  for(const f of FIELDS) H.forEach((h,i)=>{ if(map[f]<0&&!used.has(i)&&SYN[f].includes(h)){map[f]=i;used.add(i);} });
  for(const f of FIELDS) if(map[f]<0) H.forEach((h,i)=>{ if(map[f]<0&&!used.has(i)&&h&&!(f==="precio"&&/total/.test(h))&&SYN[f].some(w=>w.length>=4&&h.includes(w))){map[f]=i;used.add(i);} });
  const sizeCols=headers.map((h,i)=>i).filter(i=>!used.has(i)&&esTallaHeader(headers[i]));
  return {map,sizeCols,wide:map.talla<0&&sizeCols.length>=2};
}
/* Formato fijo del sugerido PUMA: hoja con "Cod", "SUGERIDO CARGA UN." y "CURVAS A CARGAR";
   todas las columnas con encabezado después de "CURVAS A CARGAR" son tallas (UK). */
function detectarSugeridoPuma(wb){
  for(const name of wb.SheetNames){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""});
    for(let i=0;i<Math.min(60,aoa.length);i++){
      const H=(aoa[i]||[]).map(nh);
      const cod=H.indexOf("cod"), un=H.findIndex(h=>/^sugerido carga un/.test(h)), cur=H.findIndex(h=>/^curvas a cargar/.test(h));
      if(cod<0||un<0||cur<0) continue;
      const sizeCols=[]; for(let j=cur+1;j<H.length;j++) if(H[j]!=="") sizeCols.push(j);
      const precio=[H.indexOf("especial price"),H.indexOf("whs price")].find(x=>x>=0);
      return {sheet:name,aoa,hdr:i,un,sizeCols,map:{sku:cod,talla:-1,oc:-1,cliente:-1,desc:H.indexOf("style name"),precio:precio??-1,cant:-1}};
    }
  }
  return null;
}

function construir(){
  const U=S.up, hdrs=U.aoa[U.hdr]||[], m=U.map, filas=[], desc={}, errores=[];
  if(m.sku<0) errores.push("Falta indicar la columna de SKU.");
  if(!U.wide&&m.talla<0) errores.push("Falta la columna de talla (o marca las tallas en columnas).");
  if(U.wide&&!U.sizeCols.length) errores.push("Marca qué columnas son tallas.");
  if(!U.wide&&m.cant<0) errores.push("Falta la columna de cantidad.");
  if(!U.cliente) errores.push("Elige el cliente: MELI 1P o MELI 3P.");
  if(U.tipo==="oc"&&m.oc<0&&!U.oc.trim()) errores.push("Escribe el N° de OC (el archivo no trae columna de OC).");
  if(errores.length) return {filas,desc,errores};
  for(let i=U.hdr+1;i<U.aoa.length;i++){
    const r=U.aoa[i]; const sku=normSku(r[m.sku]); if(!sku||/TOTAL/.test(sku)) continue;
    const cliente=(m.cliente>=0&&normCliente(r[m.cliente]))||U.cliente;
    const oc=U.tipo==="sugerido"?"":(m.oc>=0?clean(r[m.oc])||U.oc.trim():U.oc.trim());
    const precio=m.precio>=0?Math.round(num(r[m.precio])*100)/100:0;
    if(m.desc>=0&&r[m.desc]) desc[sku]=clean(r[m.desc]).slice(0,80);
    if(U.wide){ for(const c of U.sizeCols){const q=num(r[c]); if(q>0) filas.push([cliente,oc,sku,normTalla(hdrs[c]),q,precio]);} }
    else{ const q=num(r[m.cant]); const t=normTalla(r[m.talla]); if(q>0) filas.push([cliente,oc,sku,t||"S/T",q,precio]); }
  }
  if(!filas.length) errores.push("No encontré filas con SKU y cantidad mayor a cero. Revisa la fila de encabezado y las columnas.");
  return {filas,desc,errores};
}

  if(a==="nc-faltantes"&&f){const o=R.ocs.get(f.cliente+"|"+f.oc); if(o){for(const l of o.L) if(l.falta>0) f.lineas.push({sku:l.sku,talla:l.talla,q:String(l.falta),precio:String(l.precio||"")}); if(f.motivo===NC_MOT[0]) f.motivo="Faltante facturado";} render();}
});
$("#btnIrCargar").onclick=()=>{irTab("cargas"); setTimeout(()=>$("#drop")?.scrollIntoView({block:"center"}),0);};
$("#btnExport").onclick=exportar;
$("#fCliente").onchange=e=>{S.filtros.cliente=e.target.value; S.filtros.oc=""; S.det={ocs:null,sugeridos:null}; render();};
$("#fOc").onchange=e=>{S.filtros.oc=e.target.value; render();};
let qT; $("#fQ").oninput=e=>{clearTimeout(qT); qT=setTimeout(()=>{S.filtros.q=e.target.value; render();},150);};
$("#fCerradas").onchange=e=>{S.filtros.soloCerradas=e.target.checked; render();};
let uT; $("#fUmbral").oninput=e=>{const v=Math.max(50,Math.min(100,parseInt(e.target.value)||90)); clearTimeout(uT);
  uT=setTimeout(async()=>{ if(v===S.config.umbral) return; S.config.umbral=v; render(); try{await API.setConfig({umbral:v});}catch(_){} },500);};
document.addEventListener("change",async e=>{
  const t=e.target, U=S.up;
  if(t.name==="uTipo"){U.tipo=t.value; render(); return;}
  if(t.name==="uCli"){U.cliente=t.value; U.sugId=null; render(); return;}
  if(t.id==="uFile"&&t.files[0]){leerArchivo(t.files[0]); return;}
  if(t.id==="uSheet"){U.sheet=t.value; U.formato=null; cargarHoja(); render(); return;}
  if(t.id==="uHdr"){U.hdr=Math.max(0,(parseInt(t.value)||1)-1); aplicarHeader(); render(); return;}
  if(t.id==="ocSoloPend"){S.ocSoloPend=t.checked; render(); return;}
  if(t.id==="uSug"){U.sugId=t.value; render(); return;}
  if(t.dataset.ocsug!=null){const o=R.ocs.get(t.dataset.ocsug); if(o){try{await API.setSugeridoOc(o.cargaIds,t.value); await recargar();}catch(e){alertaGlobal(/sugerido_id/.test(errTxt(e))?"Falta actualizar la base de datos: corre en Supabase la línea nueva de schema.sql (sugerido_id).":errTxt(e));}} return;}
  if(t.dataset.map){const f=t.dataset.map; if(f==="talla"&&t.value==="wide"){U.wide=true; if(!U.sizeCols.length) U.sizeCols=(U.aoa[U.hdr]||[]).map((h,i)=>i).filter(i=>esTallaHeader(U.aoa[U.hdr][i]));} else {if(f==="talla") U.wide=false; U.map[f]=parseInt(t.value);} render(); return;}
  if(t.dataset.size!=null){const i=+t.dataset.size; U.sizeCols=t.checked?[...U.sizeCols,i]:U.sizeCols.filter(x=>x!==i); render(); return;}
  if(t.id==="uReemp"){U.reemplazar=t.checked; return;}
  if(t.dataset.ncest){ncCambiarEstado(t.dataset.ncest,t.value); return;}
  if(t.dataset.nc&&S.ncForm){const k=t.dataset.nc; S.ncForm[k]=t.value; if(k==="cliente"){S.ncForm.oc="";} if(k==="cliente"||k==="oc") render(); return;}
  if(t.dataset.cerrar!=null){const [c,o]=t.dataset.cerrar.split("|"); const k=ocKey(c,o); S.estadoOc[k]=t.checked; render();
    if(!esDemo()){try{await API.setEstadoOc(c,o,t.checked);}catch(e){alertaGlobal(errTxt(e));}} return;}
});
document.addEventListener("input",e=>{const t=e.target,U=S.up;
  if(t.id==="uCliente"){U.cliente=t.value; if(U.aoa) debRender();}
  if(t.id==="uOc"){U.oc=t.value; if(U.aoa) debRender();}
  if(t.id==="uFecha"){U.fecha=t.value;}
  if(t.id==="uVence"){U.vence=t.value;}
  if(t.dataset.nc&&S.ncForm&&t.tagName==="INPUT"){S.ncForm[t.dataset.nc]=t.value;}
  if(t.dataset.ncl&&S.ncForm){const [i,k]=t.dataset.ncl.split(":"); S.ncForm.lineas[+i][k]=t.value; if(k==="q"||k==="precio") debRender();}
});
let dR; function debRender(){clearTimeout(dR); dR=setTimeout(()=>{const ae=document.activeElement; const key=ae?.id||ae?.dataset?.ncl; render();
  const el=ae?.id?document.getElementById(ae.id):ae?.dataset?.ncl?document.querySelector(`[data-ncl="${ae.dataset.ncl}"]`):null;
  if(el&&key){el.focus(); const v=el.value; try{el.setSelectionRange(v.length,v.length);}catch(_){}}},500);}
document.addEventListener("dragover",e=>{const d=e.target.closest?.("#drop"); if(d){e.preventDefault(); d.classList.add("over");}});
document.addEventListener("dragleave",e=>{const d=e.target.closest?.("#drop"); if(d) d.classList.remove("over");});
document.addEventListener("drop",e=>{const d=e.target.closest?.("#drop"); if(d){e.preventDefault(); d.classList.remove("over"); const f=e.dataTransfer.files[0]; if(f) leerArchivo(f);}});
document.addEventListener("keydown",e=>{
  if(e.target.id==="drop"&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); $("#uFile").click();}
  const r=e.target.closest?.("tr.row"); if(r&&(e.key==="Enter")) r.click();
});
const tip=$("#tip");
document.addEventListener("mousemove",e=>{const g=e.target.closest?.("[data-tip]"); if(!g){tip.hidden=true;return;} tip.textContent=g.dataset.tip; tip.hidden=false;
  const x=Math.min(e.clientX+14,window.innerWidth-tip.offsetWidth-8), y=e.clientY+14+tip.offsetHeight>window.innerHeight?e.clientY-tip.offsetHeight-10:e.clientY+14; tip.style.left=x+"px"; tip.style.top=y+"px";});

/* ---------- Conexión a la base de datos (Supabase) ---------- */
const CFG=window.CONFIG||{};
const sb=(CFG.supabaseUrl&&CFG.supabaseAnonKey&&!/TU_/.test(CFG.supabaseUrl))?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
function errTxt(e){const m=e&&(e.message||e.error_description||e.code)||"error desconocido"; return /row-level security|permission/i.test(m)?"tu usuario no tiene permiso para esta acción.":m;}
function alertaGlobal(t){S.errDb=t; render(); setTimeout(()=>{if(S.errDb===t){S.errDb=null; render();}},6000);}
const chk=r=>{if(r.error) throw r.error; return r.data;};
async function todas(q){ // pagina de a 1000 filas
  const out=[]; for(let i=0;;i+=1000){const d=chk(await q().range(i,i+999)); out.push(...d); if(d.length<1000) return out;}
}
const API={
  async guardarCarga(meta,filas,desc){
    const row={tipo:meta.tipo,cliente:meta.cliente||null,clientes:meta.clientes,ocs:meta.ocs,oc_lbl:meta.ocLbl||null,fecha:meta.fecha||null,vence:meta.vence||null,archivo:meta.archivo,filas:meta.filas,unidades:meta.unidades,monto:meta.monto};
    if(meta.sugeridoId) row.sugerido_id=meta.sugeridoId;
    const c=chk(await sb.from("cargas").insert(row).select("id").single());
    try{
      for(let i=0;i<filas.length;i+=1000){
        const lote=filas.slice(i,i+1000).map(f=>({carga_id:c.id,cliente:f[0],oc:f[1]||"",sku:f[2],talla:f[3],q:f[4],precio:f[5]||0,descripcion:desc[f[2]]||null}));
        chk(await sb.from("carga_filas").insert(lote));
      }
    }catch(e){ await sb.from("cargas").delete().eq("id",c.id); throw e; }
  },
  async setSugeridoOc(ids,sugId){ chk(await sb.from("cargas").update({sugerido_id:sugId||null}).in("id",ids)); },
  async borrarCarga(id){ chk(await sb.from("cargas").delete().eq("id",id)); delete S.partes[id]; },
  async setEstadoOc(cliente,oc,cerrada){ chk(await sb.from("estado_oc").upsert({cliente,oc,cerrada,actualizado:new Date().toISOString()})); },
  async setConfig(v){ chk(await sb.from("config").upsert({clave:"general",valor:v})); },
  async guardarNc(id,doc){ const {creado,...d}=doc; d.fecha=d.fecha||null; if(id) chk(await sb.from("notas_credito").update(d).eq("id",id)); else chk(await sb.from("notas_credito").insert(d)); },
  async actualizarNc(id,patch){ chk(await sb.from("notas_credito").update(patch).eq("id",id)); },
  async borrarNc(id){ chk(await sb.from("notas_credito").delete().eq("id",id)); }
};
let recargando=null;
async function recargar(){
  if(recargando) return recargando;
  recargando=(async()=>{
    try{
      const [cargas,ncs,est,cfg]=await Promise.all([
        todas(()=>sb.from("cargas").select("*").order("creado")),
        todas(()=>sb.from("notas_credito").select("*").order("fecha")),
        todas(()=>sb.from("estado_oc").select("*")),
        sb.from("config").select("*").eq("clave","general").maybeSingle().then(chk)]);
      const nuevas=cargas.map(c=>c.id).filter(id=>!S.partes[id]);
      for(let i=0;i<nuevas.length;i+=50){
        const ids=nuevas.slice(i,i+50);
        const filas=await todas(()=>sb.from("carga_filas").select("carga_id,cliente,oc,sku,talla,q,precio,descripcion").in("carga_id",ids).order("id"));
        const g={}; for(const id of ids) g[id]={filas:[],desc:{}};
        for(const f of filas){const p=g[f.carga_id]; p.filas.push([f.cliente,f.oc,f.sku,f.talla,+f.q,+f.precio]); if(f.descripcion) p.desc[f.sku]=f.descripcion;}
        for(const id of ids) S.partes[id]=[g[id]];
      }
      S.cargas=cargas.map(c=>({...c,ocLbl:c.oc_lbl||"",fecha:c.fecha||"",vence:c.vence||"",unidades:+c.unidades,monto:+c.monto}));
      S.ncs=ncs.map(n=>({...n,monto:+n.monto,fecha:n.fecha||""}));
      const m={}; for(const e of est) m[ocKey(e.cliente,e.oc)]=e.cerrada; S.estadoOc=m;
      if(cfg&&cfg.valor&&cfg.valor.umbral) S.config.umbral=cfg.valor.umbral;
      S.errDb=null;
    }catch(e){ S.errDb=errTxt(e); }
    recargando=null; render();
  })();
  return recargando;
}
function pantallaLogin(msg){
  $("#app").hidden=true; const L=$("#login"); L.hidden=false;
  L.innerHTML=`<form id="fLogin"><div><div class="label">Control Fill Rate</div><h1>Ingresar</h1></div>
    ${sb?`<div class="field"><span class="label">Correo</span><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><span class="label">Contraseña</span><input id="lPass" type="password" autocomplete="current-password" required></div>
    ${msg?`<div class="msg err">${esc(msg)}</div>`:""}
    <button class="btn primary" type="submit">Entrar</button>
    <p class="muted small">¿No tienes acceso? Pídeselo a quien administra la plataforma.</p>`
    :`<div class="msg err">Falta configurar la conexión a Supabase en <b>config.js</b>.</div>`}</form>`;
  const f=$("#fLogin"); f.onsubmit=async e=>{e.preventDefault(); const b=f.querySelector("button"); b.disabled=true; b.textContent="Entrando…";
    const {error}=await sb.auth.signInWithPassword({email:$("#lEmail").value.trim(),password:$("#lPass").value});
    if(error) pantallaLogin(/invalid/i.test(error.message)?"Correo o contraseña incorrectos. Revisa mayúsculas y que no haya espacios al final.":/confirm/i.test(error.message)?"Tu usuario no está confirmado en Supabase.":error.message);};
}
let canal=null, iniciado=false;
async function iniciar(session){
  if(!session){iniciado=false; if(canal){sb.removeChannel(canal); canal=null;} pantallaLogin(); return;}
  if(iniciado) return; iniciado=true;
  S.email=(session.user.email||"").toLowerCase();
  const {data,error}=await sb.from("usuarios_permitidos").select("rol").eq("email",S.email).maybeSingle();
  if(error){iniciado=false; await sb.auth.signOut(); pantallaLogin(`La contraseña es correcta, pero falló la revisión de permisos: ${error.message}`); return;}
  if(!data){iniciado=false; await sb.auth.signOut(); pantallaLogin(`La contraseña es correcta, pero "${S.email}" no está en la lista de usuarios permitidos.`); return;}
  S.rol=data.rol; document.body.classList.toggle("lector",S.rol==="lector"); document.body.classList.toggle("editor",S.rol==="editor");
  $("#who").textContent=S.email; $("#login").hidden=true; $("#app").hidden=false; S.dbOk=true;
  render(); await recargar();
  let t; const tocar=()=>{clearTimeout(t); t=setTimeout(recargar,800);};
  canal=sb.channel("cambios");
  for(const tb of ["cargas","notas_credito","estado_oc","config"]) canal.on("postgres_changes",{event:"*",schema:"public",table:tb},tocar);
  canal.subscribe();
}
$("#btnSalir").onclick=()=>sb&&sb.auth.signOut();
$("#btnPass").onclick=()=>{$("#fPass").reset(); $("#pMsg").innerHTML=""; $("#dPass").showModal();};
$("#pCancel").onclick=()=>$("#dPass").close();
$("#fPass").onsubmit=async e=>{e.preventDefault(); const a=$("#p1").value,b=$("#p2").value,m=$("#pMsg");
  if(a.length<10){m.innerHTML='<div class="msg err">Debe tener al menos 10 caracteres.</div>';return;}
  if(a!==b){m.innerHTML='<div class="msg err">Las dos contraseñas no coinciden.</div>';return;}
  const {error}=await sb.auth.updateUser({password:a});
  m.innerHTML=error?`<div class="msg err">${esc(/same/i.test(error.message)?"Es igual a la contraseña actual. Elige otra.":error.message)}</div>`:'<div class="msg ok">Listo. Desde ahora entras con la contraseña nueva.</div>';
  if(!error) $("#fPass").reset();};
if(!sb) pantallaLogin();
else{
  sb.auth.getSession().then(({data})=>iniciar(data.session));
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="SIGNED_IN") iniciar(session); if(ev==="SIGNED_OUT") iniciar(null); });
}
})();
</script>
